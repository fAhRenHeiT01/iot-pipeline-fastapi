[build-system]
requires = ["setuptools>=65.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "fleet-realtime-lakehouse"
version = "0.1.0"
description = "Real-time IoT Telemetry Pipeline and Lakehouse serving layer with FastAPI"
readme = "README.md"
requires-python = ">=3.10"
authors = [
    { name = "Data & AI Engineering Team" }
]
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.28.0",
    "pydantic>=2.6.0",
    "pydantic-settings>=2.2.0",
    "confluent-kafka>=2.3.0",
    "databricks-sql-connector>=3.1.0",
    "typer>=0.9.0",
    "prometheus-client>=0.20.0",
    "pyyaml>=6.0.1",
    "httpx>=0.27.0",
    "pyspark>=3.5.0",
    "delta-spark>=3.0.0",
    "pyarrow>=14.0.0",
]


[project.optional-dependencies]
dev = [
    "pytest>=8.1.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.3.0",
    "httpx>=0.27.0",
]

[project.scripts]
fleet-producer = "producer.simulate_iot:app"
local-pipeline = "local_pipeline.main:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
minversion = "7.0"
testpaths = ["tests"]
python_files = ["test_*.py"]
asyncio_mode = "auto"
markers = [
    "integration: mark test as integration test",
]
filterwarnings = [
    "ignore::DeprecationWarning",
]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
]
ignore = [
    "B008", # do not perform function calls in argument defaults (FastAPI Depends)
]

[tool.ruff.lint.isort]
known-first-party = ["common", "producer", "pipeline", "api", "local_pipeline"]

